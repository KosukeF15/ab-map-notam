name: Refresh NOTAM feed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/notam-refresh.yml"
      - "Server/notam/**"
  schedule:
    - cron: "17 */3 * * *"

concurrency:
  group: notam-refresh
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Preserve the last known good feed
        id: previous
        shell: bash
        run: |
          if python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          url = "https://kosukef15.github.io/ab-map-notam/v1/notams.json"
          destination = Path("public/v1/notams.json")
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = response.read()
          feed = json.loads(payload)
          if not feed.get("updatedAt") or not feed.get("items"):
              raise ValueError("published feed is empty or invalid")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(payload)
          print(f"Preserved {len(feed['items'])} previously published NOTAM records.")
          PY
          then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not preserve the currently published NOTAM feed."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check SWIM secret configuration
        id: swim
        env:
          SWIM_USER_ID: ${{ secrets.SWIM_USER_ID }}
          SWIM_PASSWORD: ${{ secrets.SWIM_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$SWIM_USER_ID" && -n "$SWIM_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SWIM_USER_ID and SWIM_PASSWORD are not configured; keeping the current feed."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.swim.outputs.configured == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.swim.outputs.configured == 'true'
        run: pip install -r Server/notam/requirements.txt
      - name: Test NOTAM geometry parsing
        if: steps.swim.outputs.configured == 'true'
        run: python -m unittest discover -s Server/notam -p 'test_*.py' -v
      - name: Check hosted Chrome
        if: steps.swim.outputs.configured == 'true'
        run: google-chrome --version
      - name: Acquire current SWIM data
        id: acquire
        if: steps.swim.outputs.configured == 'true'
        continue-on-error: true
        timeout-minutes: 75
        env:
          SWIM_USER_ID: ${{ secrets.SWIM_USER_ID }}
          SWIM_PASSWORD: ${{ secrets.SWIM_PASSWORD }}
        run: python -u Server/notam/fetch_swim.py
      - name: Export the iOS JSON feed
        if: steps.acquire.outcome == 'success'
        shell: bash
        run: |
          python Server/notam/export_notams.py --output /tmp/notams.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          candidate = Path("/tmp/notams.json")
          feed = json.loads(candidate.read_text(encoding="utf-8"))
          if not feed.get("updatedAt") or not feed.get("items"):
              raise ValueError("newly exported feed is empty or invalid")
          published = Path("public/v1/notams.json")
          status_path = Path("Server/notam/downloads/fetch_status.json")
          status = json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {}
          failed_codes = set(status.get("failedCodes", []))

          if failed_codes and published.exists():
              previous = json.loads(published.read_text(encoding="utf-8"))
              current_by_id = {item["id"]: item for item in feed["items"]}

              def belongs_to_failed_location(item):
                  location = item.get("locationCode")
                  category = item.get("category")
                  if location in failed_codes:
                      return True
                  if "RJJJ_ENROUTE" in failed_codes and category in {"rjjj", "rjjwxyz"}:
                      return True
                  if "RJJJ_OTHER" in failed_codes and category in {"rjdr", "robl", "rjtd"}:
                      return True
                  return False

              fallback = [
                  item for item in previous.get("items", [])
                  if belongs_to_failed_location(item) and item.get("id") not in current_by_id
              ]
              feed["items"].extend(fallback)
              feed["items"].sort(key=lambda item: item["id"])
              print(
                  f"Merged {len(fallback)} last-known-good records for failed locations: "
                  f"{', '.join(sorted(failed_codes))}."
              )

          published.write_text(json.dumps(feed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Validated {len(feed['items'])} current/fallback NOTAM records.")
          PY
      - name: Report last-known-good fallback
        if: steps.swim.outputs.configured == 'true' && steps.acquire.outcome == 'failure' && steps.previous.outputs.available == 'true'
        run: echo "::warning::SWIM refresh failed after retries; publishing the last known good feed."
      - name: Validate publishable feed
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("public/v1/notams.json")
          feed = json.loads(path.read_text(encoding="utf-8"))
          if not feed.get("updatedAt") or not feed.get("items"):
              raise ValueError("no safe NOTAM feed is available for publication")
          print(f"Publishing {len(feed['items'])} NOTAM records from {feed['updatedAt']}.")
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy in a separate job so GitHub's artifact index has finished
      # propagating after upload-pages-artifact completes.
      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
